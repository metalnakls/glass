name: Release Glass

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0 for the first release or 1.1 for a point release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: glass-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    env:
      APP_NAME: Glass
      PROJECT: Apps/Glass/Glass.xcodeproj
      SCHEME: Glass
      DERIVED_DATA: .build/release-derived

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            GLASS_VERSION="$VERSION" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build

          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Package update
        run: |
          mkdir -p dist
          ZIP="dist/Glass-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Sign Sparkle update
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          SIGN_UPDATE="$(find "$DERIVED_DATA/SourcePackages" -type f -name sign_update -perm +111 | head -1)"
          test -x "$SIGN_UPDATE"

          SIGNATURE_LINE="$(printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SIGN_UPDATE" "$ZIP" --ed-key-file -)"
          echo "$SIGNATURE_LINE"

          ED_SIGNATURE="$(printf '%s' "$SIGNATURE_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(stat -f%z "$ZIP")"
          test -n "$ED_SIGNATURE"

          echo "ED_SIGNATURE=$ED_SIGNATURE" >> "$GITHUB_ENV"
          echo "LENGTH=$LENGTH" >> "$GITHUB_ENV"

      - name: Publish release and appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          ASSET_NAME="$(basename "$ZIP")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET_NAME"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S %z')"

          cat > "$RUNNER_TEMP/appcast.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Glass Updates</title>
              <item>
                <title>Glass ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>27.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="${DOWNLOAD_URL}"
                  sparkle:edSignature="${ED_SIGNATURE}"
                  length="${LENGTH}"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          gh release create "$TAG" "$ZIP" "$RUNNER_TEMP/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Glass ${VERSION}" \
            --generate-notes
