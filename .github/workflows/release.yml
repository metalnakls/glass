name: Release Glass

on:
  # Publishing waits on CI. workflow_run fires after the CI workflow completes,
  # so a release never ships from a tree that failed to build or test.
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override. Leave empty to use the version committed in the project."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: glass-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # workflow_run fires for both conclusions; only publish the green one.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      APP_NAME: Glass
      PROJECT: Apps/Glass/Glass.xcodeproj
      SCHEME: Glass
      DERIVED_DATA: .build/release-derived

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]')"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not read the release version from the VERSION file." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            GLASS_VERSION="$VERSION" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build

          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

          # sign_update ships inside the Sparkle package checkout.
          SIGN_UPDATE="$(find "$DERIVED_DATA/SourcePackages" -type f -name sign_update -perm +111 | head -1)"
          if [ -z "$SIGN_UPDATE" ]; then
            echo "Could not find sign_update in $DERIVED_DATA/SourcePackages" >&2
            exit 1
          fi
          echo "SIGN_UPDATE=$SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Package update
        run: |
          mkdir -p dist
          ZIP="dist/Glass.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Sign Sparkle update
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -x "$SIGN_UPDATE"

          SIGNATURE_LINE="$(printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SIGN_UPDATE" "$ZIP" --ed-key-file -)"
          echo "$SIGNATURE_LINE"

          ED_SIGNATURE="$(printf '%s' "$SIGNATURE_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(stat -f%z "$ZIP")"
          test -n "$ED_SIGNATURE"

          echo "ED_SIGNATURE=$ED_SIGNATURE" >> "$GITHUB_ENV"
          echo "LENGTH=$LENGTH" >> "$GITHUB_ENV"

      - name: Publish release and appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          ASSET_NAME="$(basename "$ZIP")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Glass.zip"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S %z')"

          cat > "$RUNNER_TEMP/appcast.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Glass Updates</title>
              <item>
                <title>Glass ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>27.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="${DOWNLOAD_URL}"
                  sparkle:edSignature="${ED_SIGNATURE}"
                  length="${LENGTH}"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          # Every push publishes, so an unchanged VERSION can re-run. Replace the
          # existing tag and assets instead of failing on a duplicate release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$ZIP" "$RUNNER_TEMP/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Glass ${VERSION}" \
            --generate-notes
