name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      # Only the SwiftPM package is tested here. The macOS app target needs the
      # macOS 27 SDK for APIs such as swipeActionsContainer(), which no
      # GitHub-hosted runner ships, so the app itself is built and published
      # locally by Scripts/build-mac-app.sh and Scripts/release.sh.
      - name: Test
        run: swift test --package-path . --disable-sandbox
