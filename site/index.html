<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glass</title>
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    align-content: center;
    row-gap: 1.25rem;
    background: #fff;
  }
  .button { grid-row: 2; align-self: end; }
  pre { grid-row: 3; align-self: start; }
  @media (prefers-color-scheme: dark) { body { background: #000; } }
  .button {
    display: inline-block;
    padding: .7rem 1.6rem;
    border-radius: 8px;
    background: #000;
    color: #fff;
    text-decoration: none;
    font: 500 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .button { background: #fff; color: #000; }
  }
  pre {
    margin: 0;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #888;
  }
  @media (prefers-color-scheme: dark) { pre { color: #666; } }
  .privacy {
    grid-row: 4;
    margin: 0 0 1rem;
    color: #888;
    font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
  }
</style>
</head>
<body>
  <a class="button" href="https://github.com/metalnakls/glass/releases/latest/download/Glass.zip">download</a>
  <pre>xattr -cr /Applications/Glass.app</pre>
  <a class="privacy" href="privacy.html">privacy</a>
</body>
</html>
