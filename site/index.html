<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) { body { background: #000; } }
  .button {
    display: inline-block;
    padding: .7rem 1.6rem;

    background: #000;
    color: #fff;
    text-decoration: none;
    font: 500 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .button { background: #fff; color: #000; }
  }
  pre {
    margin: 0;
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #888;
  }
  @media (prefers-color-scheme: dark) { pre { color: #666; } }
</style>
</head>
<body>
  <a class="button" href="https://github.com/metalnakls/glass/releases/latest/download/Glass.zip">download</a>
  <pre>xattr -cr /Applications/Glass.app</pre>
